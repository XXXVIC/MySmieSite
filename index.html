<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Котячі Новини 🐾</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6K03MDRFKG"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-6K03MDRFKG');
  </script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#fff7f0;
      color:#2b2b2b;
      line-height:1.6;
    }

    header{
      background:linear-gradient(135deg,#ffb36b,#ff7b54);
      color:white;
      padding:70px 20px;
      text-align:center;
    }

    .container{
      width:90%;
      max-width:1100px;
      margin:auto;
      padding:50px 0;
    }

    .section-title{
      font-size:34px;
      margin-bottom:30px;
      color:#ff6b3d;
      text-align:center;
    }

    .news-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 5px 18px rgba(0,0,0,0.08);
      transition:0.3s;
      cursor:pointer;
    }

    .card:hover{
      transform:translateY(-6px);
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .card-content{
      padding:22px;
    }

    footer{
      margin-top:60px;
      background:#ff7b54;
      color:white;
      text-align:center;
      padding:25px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🐾 Котячі Новини</h1>
    <p>Найцікавіші історії про котиків</p>
  </header>

  <div class="container">

    <h2 class="section-title">🔥 Свіжі новини</h2>

    <div class="news-grid">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?q=80&w=1200&auto=format&fit=crop" alt="Кіт">
        <div class="card-content">
          <h3>Барсик врятував голуба</h3>
          <p>
            Рудий кіт Барсик став героєм району після порятунку голуба.
          </p>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1495360010541-f48722b34f7d?q=80&w=1200&auto=format&fit=crop" alt="Кіт">
        <div class="card-content">
          <h3>Марсик пережив напад собаки</h3>
          <p>
            Марсик зміг врятуватися під автомобілем та повернувся додому.
          </p>
        </div>
      </div>

    </div>

  </div>

  <footer>
    © 2026 Котячі Новини 🐾
  </footer>

  <!-- JS ТУТ -->
  <script>

    // Коли сторінка повністю завантажилась
    document.addEventListener('DOMContentLoaded', () => {

      // Всі картки
      const newsCards = document.querySelectorAll('.card');

      // Флаг
      let hoverTracked = false;

      // Для кожної картки
      newsCards.forEach(card => {

        card.addEventListener('mouseenter', () => {

          // Лише 1 раз
          if (!hoverTracked) {

            // Відправка події
            gtag('event', 'hover_cat_news_card');

            console.log('GA event sent');

            hoverTracked = true;
          }

        });

      });

    });

  </script>

</body>
</html>
